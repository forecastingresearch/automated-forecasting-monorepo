<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EEAI economy model</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* FRI brand, as on AIRO's page (web/demo/00-head.html): Season Sans for
     text (licensed, self-hosted from web/fonts/, absent from a clone), DM Mono
     for figures, the stone ground. The scenario colours are EEAI's: validated
     with the dataviz palette check against the white panel (CVD separation in
     the 6-8 band, so every scenario line is also labelled at its end). */
  @font-face { font-family: "Season Sans"; src: url("web/fonts/SeasonSans-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Season Sans"; src: url("web/fonts/SeasonSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Season Sans"; src: url("web/fonts/SeasonSans-SemiBold.woff2") format("woff2"); font-weight: 600 800; font-display: swap; }
  :root {
    --bg: #f6f8f1; --panel: #ffffff; --well: #f3f5ef;
    --ink: #1f2328; --ink-soft: #57606a; --ink-faint: #6e7781;
    --line: #d0d7de; --line-soft: #eaeef2;
    --link: #115633; --accent-orange: #c4561b;
    --slow: #d9703a; --moderate: #2f9e6e; --rapid: #5b4bd5;
    --uncond: #3d4a8f; --band: rgba(91, 107, 200, 0.14);
    --warn-bg: #fdeee2; --warn-ink: #9a4212; --warn-line: #e96b26;
    --shadow: 0 1px 2px rgba(16, 43, 35, 0.06), 0 6px 20px rgba(16, 43, 35, 0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Season Sans", system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  #root { max-width: 1180px; margin: 0 auto; padding: 32px 16px 72px; }
  @media (min-width: 720px) { #root { padding: 32px 28px 72px; } }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  h1 { font-size: clamp(25px, 7.5vw, 33px); margin: 8px 0 6px; }
  h2 { font-size: 24px; }
  h3 { font-size: 15.5px; line-height: 1.25; }
  a { color: var(--link); }
  .mono { font-family: "DM Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .brand-logo { display: block; width: 231px; max-width: 70vw; height: auto; margin-bottom: 22px; }
  .top { display: flex; flex-wrap: wrap; gap: 0 20px; align-items: flex-start; justify-content: space-between; }
  .dl { display: inline-flex; align-items: center; flex-shrink: 0; background: var(--ink); color: #fff; text-decoration: none; border-radius: 12px; padding: 11px 18px; box-shadow: var(--shadow); font-size: 15.5px; font-weight: 700; letter-spacing: 0.01em; }
  .dl { transition: transform .15s ease, box-shadow .15s ease; }
  .dl:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(16, 43, 35, .1), 0 10px 26px rgba(16, 43, 35, .14); }
  .dl:active { transform: none; }
  .dl:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .top .dl { margin-bottom: 18px; }
  .lede { color: var(--ink-soft); max-width: 780px; margin: 0 0 10px; }
  .meta { color: var(--ink-faint); font-size: 13px; margin: 0; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); border-radius: 10px; padding: 10px 14px; margin: 18px 0 0; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 16px; box-shadow: var(--shadow); padding: 22px 18px; margin-top: 22px; }
  @media (min-width: 720px) { .card { padding: 30px 32px; } }
  .card > .sub { color: var(--ink-soft); margin: 4px 0 0; }
  .head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-start; justify-content: space-between; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; background: var(--well); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px; }
  .seg .lab { color: var(--ink-faint); font-size: 13px; padding: 0 8px 0 8px; }
  .seg button { border: 0; background: none; color: var(--ink); font-size: 14px; padding: 6px 12px; border-radius: 7px; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
  .seg button[aria-pressed="false"]:hover { background: rgba(31, 35, 40, .07); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  .controls { align-items: center; }
  .mini { display: inline-flex; margin-left: auto; background: var(--well); border: 1px solid var(--line-soft); border-radius: 8px; padding: 2px; }
  .mini button { border: 0; background: none; color: var(--ink-soft); font-size: 11.5px; padding: 4px 9px; border-radius: 6px; cursor: pointer; transition: color .15s ease; }
  .mini button[aria-pressed="false"]:hover { color: var(--ink); }
  .mini button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .mini button:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px 44px; margin-top: 20px; align-items: flex-end; }
  .stat .k { color: var(--ink-soft); font-size: 13.5px; }
  .stat .v { font-size: 22px; }
  .stat .v.big { font-size: 46px; line-height: 1.05; font-weight: 500; }
  /* (tabular figures are for the number; in Season Sans they also widen the space, so the unit turns them off) */
  .stat .v small { font-family: "Season Sans", system-ui, sans-serif; font-variant-numeric: normal; font-size: 14px; color: var(--ink-soft); font-weight: 400; margin-left: 4px; }
  .up { color: var(--accent-orange); } .down { color: var(--uncond); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 16px; color: var(--ink-soft); font-size: 13.5px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid currentColor; }
  .sw.dash { border-top-style: dashed; }
  .sw.band { height: 10px; border: 0; background: var(--band); border-radius: 2px; }
  .sw.ring { width: 10px; height: 10px; border: 2px solid var(--ink-soft); border-radius: 50%; }
  .sw.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: currentColor; }
  .chart { position: relative; margin-top: 10px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart svg.zooming { overflow: hidden; pointer-events: none; }
  .chart svg.zooming .fc { animation: none; }
  .chart text { font-family: "Season Sans", system-ui, sans-serif; fill: var(--ink-faint); font-size: 12px; }
  .chart text.end { fill: var(--ink); font-size: 12.5px; }
  /* The tooltip, as the survey's: a column per series, numbers right-aligned with their intervals beneath. */
  /* (as wide as its columns need, which can be wider than a small chart; hover keeps it inside the window) */
  .tip { box-sizing: border-box; width: max-content; max-width: min(440px, calc(100vw - 16px)); position: absolute; pointer-events: none; background: #202c27; color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; z-index: 5; box-shadow: 0 8px 28px #102b2326; }
  .tip .who { display: grid; gap: 2px 8px; margin-top: 3px; text-align: right; justify-items: end; }
  .tip .who > :first-child, .tip .who > i:not(:has(u)), .tip .who > b:not(.mono) { justify-self: start; text-align: left; }
  .tip-number { justify-self: stretch; min-width: 0; text-align: right; }
  .tip-number small { display: block; font-size: 0.85em; line-height: 1.2; opacity: .8; white-space: nowrap; }
  .tip-value { white-space: nowrap; }
  .tile:has(.tip:not([style*="none"])) { position: relative; z-index: 2; }
  .tip .who b { font-weight: 600; }
  .tip .who u { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; text-decoration: none; }
  .tip b { font-weight: 600; } .tip .row { display: flex; gap: 12px; justify-content: space-between; } .tip i { font-style: normal; opacity: .75; }
  .well { background: var(--well); border: 1px solid var(--line-soft); border-radius: 12px; padding: 16px 18px; margin-top: 20px; }
  .eyebrow { font-family: "DM Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 0 0 4px; }
  .well p { margin: 0; } .well hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 18px; }
  .tile { border: 1px solid var(--line-soft); border-radius: 14px; padding: 16px 16px 14px; min-width: 0; }
  .tile .cat { color: var(--ink-faint); font-size: 12px; }
  .tile .num { margin-top: 6px; font-size: 14px; }
  .tile .num b { font-weight: 500; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 13px; color: var(--ink-soft); }
  .chips span { display: inline-flex; align-items: center; gap: 5px; }
  /* Headline and forecast cards, as the survey's: a card opens the shared detail dialog. */
  .headline-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
  .headline { display: flex; flex-direction: column; }
  .headline .sub { margin: 4px 0 auto; padding-bottom: 16px; }
  .headline small { display: block; color: var(--ink-soft); }
  .headline-values b { font-size: clamp(24px, 2.7vw, 36px); font-weight: 500; }
  @media (max-width: 850px) { .headline-grid { grid-template-columns: 1fr; } }
  .forecast-card { cursor: pointer; }
  .forecast-card:is(:hover,:focus-within) { border-color: var(--link); }
  .forecast-trigger { font: inherit; color: inherit; background: none; padding: 0; border: 0; text-align: left; cursor: pointer; }
  /* The shared dialog, styled as on the survey page. */
  body #question-dialog { width: min(960px, calc(100% - 24px)); height: min(86dvh, 850px); max-height: 90dvh; margin: auto; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 80px #102b2340; }
  #question-dialog .question-shell { padding: 0 clamp(14px, 4vw, 40px) 28px; }
  #question-dialog #question-id { color: var(--ink-soft); font-size: 13px; }
  #question-dialog #question-views { gap: 2px; }
  #question-dialog #question-views button { font: inherit; font-size: 14px; border: 0; border-bottom: 2px solid transparent; }
  #question-dialog #question-views button[aria-pressed=true] { border-color: var(--link); color: var(--link); font-weight: 600; }
  #question-dialog button:hover { background: var(--well); }
  #question-content .scroll { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0 18px; }
  #question-content table.tv { margin: 0; }
  #question-content .tv th, #question-content .tv td { padding: 7px 10px; }
  #question-content .tv thead { background: var(--well); }
  #question-content .tv thead th { white-space: normal; vertical-align: bottom; }
  #question-content h3 { margin: 22px 0 6px; }
  #question-content .lede { font-size: 15.5px; color: var(--ink); max-width: 72ch; margin: 0; }
  #question-content small.range, #question-content small.unit { display: block; color: var(--ink-faint); font-size: 10.5px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .dialog-chart .legend { margin-top: 8px; }
  .dialog-controls { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 18px; }
  .dialog-controls .seg { flex-wrap: wrap; }
  /* How an outcome is computed: the equations, and a left-to-right diagram from the forecasts to the outcome. */
  .eq { background: var(--well); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 16px; font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-size: 15.5px; color: var(--ink); }
  .eq p { margin: 6px 0; line-height: 1.6; }
  .flow { display: flex; gap: 28px; align-items: stretch; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
  .flow-col { display: flex; flex-direction: column; gap: 8px; justify-content: center; min-width: 150px; flex: 1; position: relative; }
  .flow-col + .flow-col::before { content: "→"; position: absolute; left: -22px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); font-size: 18px; }
  .flow-head { color: var(--ink-faint); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .node { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); }
  .node.input { border-color: var(--moderate); box-shadow: inset 3px 0 0 var(--moderate); }
  .node.computed { background: var(--well); }
  .node.outcome { border: 2px solid var(--ink); }
  .node-name { font-size: 13px; color: var(--ink); }
  .node-value { font-size: 15px; margin-top: 2px; }
  .node-unit { color: var(--ink-faint); font-size: 11px; }
  .sym { font-family: "STIX Two Text", "Cambria Math", Georgia, serif; font-style: italic; margin-right: 6px; color: var(--ink-soft); text-transform: none; letter-spacing: 0; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); }
  .key.input { border-color: var(--moderate); background: var(--moderate); }
  .key.computed { background: var(--well); }
  @media (max-width: 719px) {
    .flow { flex-direction: column; gap: 24px; }
    .flow-col + .flow-col::before { content: "↓"; left: 50%; top: -20px; transform: translateX(-50%); }
  }
  table.tv { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 4px 0 10px; }
  table.tv th, table.tv td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  table.tv th:first-child, table.tv td:first-child { text-align: left; }
  table.tv thead th { color: var(--ink-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .scroll { overflow-x: auto; }
  .bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 10px; }
  .bar div { min-width: 2px; }
  /* Scenario bars and names that show the scenario's definition, as the survey's. */
  .ai-progress { position: relative; }
  .scenario-bars { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 10px; }
  .scenario-bars figure { margin: 0; min-width: 0; }
  .scenario-bars figcaption { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
  .scenario-bars .bar button { min-width: 0; border: 0; padding: 0; cursor: help; }
  .scenario-bars .bar button:is(:hover,:focus-visible) { box-shadow: inset 0 0 0 2px var(--ink); }
  .scenario-label { width: 100%; text-align: left; background: none; color: inherit; border: 0; padding: 0; font: inherit; cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
  .progress-tooltip { position: absolute; z-index: 5; pointer-events: none; background: #202c27; color: white; border-radius: 10px; padding: 12px 14px; width: min(330px, calc(100vw - 20px)); font-size: 14px; box-shadow: var(--shadow); }
  .progress-tooltip small { display: block; color: #d4e2da; }
  .progress-tooltip p { margin: 6px 0 0; }
  .empty { color: var(--ink-soft); padding: 26px 0 6px; }
  /* Motion, all of it small: the control just used presses in, the forecasts
     fade in when a control redraws a chart (the record and the axes do not),
     an opened section fades in. None of it for a reader who asks for less. */
  @keyframes press { from { transform: scale(.93); opacity: .55; } }
  @keyframes fade { from { opacity: 0; } }
  .seg button.just, .mini button.just { animation: press .22s ease; }
  .chart svg .fc, .chart svg text.end { animation: fade .32s ease both; }
  .still .chart svg .fc, .still .chart svg text.end { animation: none; }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } }
    .forecast-card, #question-dialog button { transition: border-color .16s ease, background-color .16s ease, box-shadow .16s ease; }
    .forecast-card:is(:hover,:focus-within) { box-shadow: 0 3px 12px #102b2314; }
    #question-dialog[open] { animation: reveal .18s ease-out; }
    #question-content > :first-child { animation: reveal .13s ease-out; }
    #question-dialog[open]::backdrop { animation: fade .18s ease-out; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, dialog::backdrop { animation: none !important; transition: none !important; }
  }
  footer { color: var(--ink-faint); font-size: 13px; margin-top: 28px; }
  footer p { margin: 0 0 6px; }
  /* The economy model's own pieces: the page switch, fan bands, inline bars, the diagnostics. */
  .pages { display: inline-flex; gap: 2px; background: var(--well); border: 1px solid var(--line-soft); border-radius: 10px; padding: 4px; margin: 0 0 14px; }
  .pages a { color: var(--ink); text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 7px; }
  .pages a:hover { background: rgba(31, 35, 40, .07); }
  .pages a[aria-current="page"] { background: var(--ink); color: #fff; }
  .pages a:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
  .note { color: var(--ink-faint); font-size: 12.5px; margin: 8px 0 0; }
  .tile .unit { color: var(--ink-faint); font-size: 12px; }
  .hbar { display: inline-block; height: 9px; border-radius: 2px; background: var(--uncond); vertical-align: middle; }
  .hbar.neg { background: var(--accent-orange); }
  td.bar { width: 30%; min-width: 90px; text-align: left !important; }
  .ok { color: var(--moderate); } .warn { color: var(--warn-ink); }
  /* The survey's small dates, under a value or beside a caption. */
  .forecast-date { display: block; font-family: "Season Sans", system-ui, sans-serif; font-weight: 400; line-height: 1.25; color: var(--ink-soft); font-size: 11px; }
  .ai-progress td { vertical-align: top; }
  /* The ranked dot charts (industries, occupation groups): a name column and a shared scale. */
  .mini.measure { margin-left: 0; flex-wrap: wrap; }      /* (the measure toggle leads the row; Chart / Table stays at its end) */
  .rank { position: relative; margin-top: 12px; }
  .rank-axis, .rank-row { display: grid; grid-template-columns: minmax(140px, 32%) minmax(0, 1fr); gap: 14px; align-items: center; }
  .rank-axis { position: sticky; top: 0; background: var(--panel); z-index: 1; padding-bottom: 2px; border-bottom: 1px solid var(--line-soft); }
  .rank-row { padding: 2px 6px; margin: 0 -6px; border-radius: 6px; }
  .rank-row.on, .rank-row:focus-visible { background: var(--well); outline: none; }
  .rank-name { font-size: 13px; color: var(--ink); text-align: right; line-height: 1.2; }
  .rank-track { min-width: 0; }
  .rank-track svg { display: block; overflow: visible; }
  .rank-track text { font-family: "Season Sans", system-ui, sans-serif; fill: var(--ink-faint); font-size: 11.5px; }
  @media (max-width: 719px) {
    .rank-axis, .rank-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .rank-axis > span { display: none; }
    .rank-name { text-align: left; font-size: 12.5px; padding-top: 4px; }
  }
  .split2 { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .split2 > * { min-width: 0; }      /* (so a wide table scrolls in its column instead of widening the page) */
  @media (min-width: 900px) { .split2 { grid-template-columns: 1fr 1fr; } }
</style>

<body>
<div id="root"></div>
